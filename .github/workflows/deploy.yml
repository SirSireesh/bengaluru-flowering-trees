name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Create datasets directory
        run: mkdir -p scripts/datasets/blr-tree-census

      - name: Cache tree census data
        id: cache-kml
        uses: actions/cache@v3
        with:
          path: scripts/datasets/blr-tree-census/bbmp_tree_census_july2025.kml
          key: tree-census-data-v1

      - name: Download tree census data
        if: steps.cache-kml.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss, downloading tree census data..."
          curl -L -o scripts/datasets/blr-tree-census/temp.kmz "https://data.opencity.in/dataset/9151032e-4423-4697-81a2-e29018a4facd/resource/44623cd8-b167-4c02-bff1-5120e37beabc/download/8128cdd5-579d-428a-a464-d4578069f296.kmz"
          # Extract KML from KMZ (KMZ is just a ZIP file)
          unzip -o scripts/datasets/blr-tree-census/temp.kmz -d scripts/datasets/blr-tree-census/
          # Check if the expected KML file exists
          if [ -f "scripts/datasets/blr-tree-census/bbmp_tree_census_july2025.kml" ]; then
            echo "Successfully extracted KML file"
          else
            # If not, find any KML file and rename it
            KML_FILE=$(find scripts/datasets/blr-tree-census -name "*.kml" | head -1)
            if [ -n "$KML_FILE" ]; then
              mv "$KML_FILE" scripts/datasets/blr-tree-census/bbmp_tree_census_july2025.kml
              echo "Successfully extracted and renamed KML file"
            else
              echo "Error: No KML file found in the KMZ archive"
              exit 1
            fi
          fi
          rm scripts/datasets/blr-tree-census/temp.kmz

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check for changes in Python scripts or input data
        id: check-changes
        run: |
          # Get the list of changed files in this push
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | tr '\n' ' ')
          echo "Changed files: $CHANGED_FILES"
          
          # Check if any of the relevant files have changed
          RELEVANT_CHANGES=$(echo "$CHANGED_FILES" | grep -E '(scripts/tree_census_points_generator\.py|public/tree_species\.parquet)')
          
          if [ -n "$RELEVANT_CHANGES" ]; then
            echo "Relevant changes detected: $RELEVANT_CHANGES"
            echo "regenerate=true" >> $GITHUB_OUTPUT
          else
            echo "No relevant changes detected"
            echo "regenerate=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate GeoJSON files
        if: steps.check-changes.outputs.regenerate == 'true'
        run: |
          python scripts/tree_census_points_generator.py --tree-census-data scripts/datasets/blr-tree-census/bbmp_tree_census_july2025.kml --tree-bloom-data public/tree_species.parquet --output-dir public/geojson
          echo "=== Files in public/geojson after Python step ==="
          ls -la public/geojson/ | head -20

      - name: Install Node dependencies
        run: npm install

      - name: Compress GeoJSON files
        if: steps.check-changes.outputs.regenerate == 'true'
        run: |
          echo "=== Files in public/geojson before compression ==="
          ls -la public/geojson/ | head -20
          npm run compress-geojson
          echo "=== Files in public/geojson after compression ==="
          ls -la public/geojson/ | grep "\.gz$" || echo "No .gz files found"

      - name: Build
        run: |
          npm run build
          echo "=== Files in dist/geojson after build ==="
          ls -la dist/geojson/ | head -20
          echo "=== .gz files in dist/geojson ==="
          ls -la dist/geojson/*.gz 2>/dev/null || echo "No .gz files in dist/geojson/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4